<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tigrinho - Meu Mundo Virtual</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  text-align: center;
  color: white;
  background: linear-gradient(#24105c, #e66b24);
  min-height: 100vh;
}
h1 { padding-top: 25px; }
.tiger { font-size: 120px; margin: 25px; }
button {
  background: #ffc928;
  border: 0;
  border-radius: 15px;
  padding: 18px 30px;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
}
.score {
  font-size: 28px;
  margin: 25px;
}
</style>
</head>
<body>

<h1>🐯 Tigrinho - Meu Mundo Virtual</h1>

<div class="tiger">🐯</div>

<h2>Bem-vindo ao jogo!</h2>

<div class="score">
  ⭐ Estrelas: <span id="score">0</span>
</div>

<button onclick="ganharEstrela()">
  GANHAR ESTRELA ⭐
</button>

<p id="message">Clique no botão para começar!</p>

<script>
let pontos = 0;

function ganharEstrela() {
  pontos++;
  document.getElementById("score").textContent = pontos;
  document.getElementById("message").textContent =
    "Parabéns! Você ganhou uma estrela! 🐯";
}
</script>

</body>
</html>
